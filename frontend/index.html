<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Asistencia · Seguridad</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <script>
    // Aplica el tema elegido antes de pintar, para que no parpadee.
    try { var t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"><div class="cargando">Cargando…</div></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
